spring.application.name=gateway
server.port=8081

spring.cloud.gateway.server.webmvc.routes[0].id=patient-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/patients/**

app.security.username=${APP_USERNAME}
app.security.password=${APP_PASSWORD}